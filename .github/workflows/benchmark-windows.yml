name: Benchmark (Windows)

# Time to first command (misc/bench) of this commit against a reference
# commit, on Windows x64 and arm64.  Run manually.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets in the generated tree (gen_bench.py --targets)'
        default: '2000'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          arch: x64
        - os: windows-11-arm
          arch: arm64

    env:
      TARGETS: ${{ inputs.targets }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    # cl for the benchmark tools.
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Build ninja
      shell: bash
      run: |
        cmake -Bbuild -A ${{ matrix.arch }}
        cmake --build build --parallel --config Release

    - name: Set up the benchmark tree
      shell: bash
      run: |
        python misc/bench/bench.py setup --targets "$TARGETS" \
          --ninja build/Release/ninja.exe "$RUNNER_TEMP/bench"

    # (win-timeline branch: diagnostics, not for merging.)
    - name: Timeline
      shell: bash
      run: |
        ninja="$PWD/build/Release/ninja.exe"
        {
          echo "### ${{ matrix.arch }}: $(git rev-parse --short HEAD), $NUMBER_OF_PROCESSORS processors"
          for dir in out/Default out/CMake; do
            cd "$RUNNER_TEMP/bench/$dir"
            touch_file=$(cat ../../touch_file)
            echo
            echo "$dir:"
            echo '```'
            for i in 1 2 3 4 5 6; do
              touch "$touch_file"
              echo "run $i:"
              NINJA_TIMELINE=1 "$ninja" 2>&1 >/dev/null | grep -E "timeline|counters" || true
            done
            for extra in 4 12; do
              for i in 1 2 3; do
                touch "$touch_file"
                echo "NINJA_EXTRA_STAT_THREADS=$extra, run $i:"
                NINJA_EXTRA_STAT_THREADS=$extra NINJA_TIMELINE=1 "$ninja" 2>&1 >/dev/null | grep -E "timeline|counters" || true
              done
            done
            touch "$touch_file"
            echo "-d nostatcache:"
            NINJA_TIMELINE=1 "$ninja" -d nostatcache 2>&1 >/dev/null | grep -E "timeline|counters" || true
            touch "$touch_file"
            echo "-d stats -n:"
            "$ninja" -d stats -n | grep -v '^\['
            "$ninja" >/dev/null
            echo '```'
            cd - >/dev/null
          done
        } | tee -a "$GITHUB_STEP_SUMMARY"
